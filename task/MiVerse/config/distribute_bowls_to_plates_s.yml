# One room-axis translation per environment. Only Ground-rooted furniture is
# listed; all table-supported plates/bowls inherit the translated table frame.
# Offsets are measured from the ORIGINAL layout, never the last sampled pose.
# +X / -Y: right / down in the reference view; no left/up translation.
LayoutTranslations:
- labels: [table, chair_north, chair_east, chair_west]
  xlim: [0.05, 0.30]    # 5--30 cm toward +X
  ylim: [-0.35, -0.05]  # 5--35 cm toward -Y

