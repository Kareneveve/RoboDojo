# Television011 from LivingRoom009, respawned as a labeled free-standing
# articulation at its authored pose so the reward manager can detect contact
# through pose drift. z is lifted 1 mm above the authored value so the body
# settles onto TvStand051 instead of starting interpenetrated.
- common:
    check_mode: enforce
    margin: 0.0
    need_check_stable: true
    pose_mode: absolute
    qpos:
    - 0.707106769
    - 0.0
    - 0.0
    - 0.707106793
    rotate_rand: false
    zlim:
    - 0.8965112653
    - 0.8965112653
    relative_plane: Ground
    xlim:
    - -1.8294844596
    - -1.8294844596
    ylim:
    - 0.1491607039
    - 0.1491607039
